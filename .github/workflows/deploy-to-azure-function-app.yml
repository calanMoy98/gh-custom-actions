name: Reusable Deployment Workflow to Azure Function App
description: >
  Builds a Java Azure Functions app (mvn clean package -DskipTests) and deploys it.
  Requires repo secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE (pass via secrets: inherit or explicitly).
  Defaults: java-version=25, sku=flexconsumption, respect-pom-xml=true, remote-build=false.
  After a successful deploy, uploads the package artifact named after function-app-name for release handoff.

on:
  workflow_call:
    # used to define inputs or secrets passed from a caller
    inputs:
      function-app-name:
        description: "Name of the Azure Function App to deploy to"
        required: true
        type: string
      # Caller decides this path; Maven azure-functions plugin usually writes target/azure-functions/<functionAppName>
      function-package-path:
        description: "Path to the built function package (target/azure-functions/<app-name>)"
        required: true
        type: string
      pom-xml-directory:
        description: "Directory containing pom.xml, relative to repo root"
        required: false
        type: string
        default: "."
      java-version:
        description: "JDK version to use"
        required: false
        type: string
        default: "25"
      environment-name:
        description: "GitHub environment to deploy against (e.g. development)"
        required: false
        type: string
        default: "development"
      sku:
        description: "Azure Functions hosting SKU"
        required: false
        type: string
        default: "flexconsumption"
    secrets:
      AZURE_FUNCTIONAPP_PUBLISH_PROFILE:
        description: "Publish profile for the Azure Function App (caller repo secret)"
        required: true

# make sure the caller workflow also grants it at the top level, since a called workflow can't claim permissions the caller doesn't allow
permissions:
  contents: read # allows github actions to clone the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    steps:
      - name: "Checkout code from Github"
        uses: actions/checkout@v6

      - name: "Setup Java Sdk ${{ inputs.java-version }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "microsoft"
          cache: maven

      - name: "Build function package with Maven"
        shell: bash
        run: |
          pushd './${{ inputs.pom-xml-directory }}'
          mvn clean package -DskipTests
          popd

      - name: "Deploy to Azure Functions"
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.function-app-name }}
          package: ${{ inputs.function-package-path }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          respect-pom-xml: true
          sku: ${{ inputs.sku }}
          remote-build: false

      - name: "Upload function package artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.function-app-name }}
          path: ${{ inputs.function-package-path }}
